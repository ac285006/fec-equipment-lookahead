<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>United Rentals Planning View</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top"><img src="/fec-official.svg"></header><main class="wrap"><div id="login" class="card login"><h2>United Rentals Planning View</h2><p class="note">Read-only upcoming demand.</p><div class="field"><label>Password</label><input id="pw" type="password"></div><button class="btn full" id="go">Sign In</button><p id="err" class="bad"></p></div><div id="app" class="hidden"><div class="hero"><div class="muted">READ-ONLY VENDOR VIEW</div><h1>Upcoming Equipment Demand</h1></div><div class="card table"><table><thead><tr><th>Trade Partner</th><th>Equipment</th><th>Qty</th><th>Date Needed</th><th>Duration</th><th>Area</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>const $=id=>document.getElementById(id);$('go').onclick=async()=>{const r=await fetch('/api/vendor',{headers:{authorization:'Bearer '+$('pw').value}});if(!r.ok){$('err').textContent='Access denied.';return}const d=await r.json();$('login').classList.add('hidden');$('app').classList.remove('hidden');$('rows').innerHTML=d.partners.flatMap(p=>p.items.map(i=>`<tr><td>${p.company}</td><td>${i.type}</td><td>${i.quantity}</td><td>${i.dateNeeded}</td><td>${i.duration||'—'}</td><td>${i.area||'—'}</td></tr>`)).join('')||'<tr><td colspan="6">No submitted demand yet.</td></tr>'};</script></body></html>
