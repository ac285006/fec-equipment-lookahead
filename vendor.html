<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>United Rentals - Equipment Demand</title>
  <link rel="stylesheet" href="/styles.css">

  <style>
    .vendor-wrap {
      max-width: 1100px;
      width: calc(100% - 40px);
      margin: 0 auto;
      padding: 28px 0 60px;
    }

    .vendor-card {
      background: #111821;
      border: 1px solid #2b3b4e;
      border-radius: 14px;
      padding: 18px;
      margin-top: 20px;
      overflow-x: auto;
    }

    .vendor-table {
      width: 100%;
      border-collapse: collapse;
    }

    .vendor-table th,
    .vendor-table td {
      text-align: left;
      padding: 14px 12px;
      border-bottom: 1px solid #2b3b4e;
      vertical-align: top;
    }

    .vendor-table th {
      white-space: nowrap;
    }

    .vendor-table td.notes {
      min-width: 220px;
    }

    .vendor-table td.location {
      min-width: 180px;
    }

    .muted {
      color: #aeb9c7;
    }
  </style>
</head>

<body>

<header class="top">
  <img src="/fec-logo.png" alt="FEC First Equipment Company">
</header>

<main class="vendor-wrap">

  <div class="muted">READ-ONLY VENDOR VIEW</div>
  <h1>Upcoming Equipment Demand</h1>

  <div class="vendor-card">
    <table class="vendor-table">
      <thead>
        <tr>
          <th>Trade Partner</th>
          <th>Equipment</th>
          <th>Qty</th>
          <th>Date Needed</th>
          <th>Duration</th>
          <th>Area / Location</th>
          <th>Notes</th>
        </tr>
      </thead>

      <tbody id="rows">
        <tr>
          <td colspan="7">Loading equipment demand...</td>
        </tr>
      </tbody>
    </table>
  </div>

</main>

<script>
function esc(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

async function loadVendorData() {
  const password = prompt('United Rentals password:');

  if (!password) {
    document.getElementById('rows').innerHTML =
      '<tr><td colspan="7">Access cancelled.</td></tr>';
    return;
  }

  try {
    const response = await fetch('/api/vendor', {
      headers: {
        Authorization: 'Bearer ' + password
      }
    });

    if (!response.ok) {
      document.getElementById('rows').innerHTML =
        '<tr><td colspan="7">Unable to access vendor view.</td></tr>';
      return;
    }

    const data = await response.json();

    if (!data.length) {
      document.getElementById('rows').innerHTML =
        '<tr><td colspan="7">No upcoming equipment requests.</td></tr>';
      return;
    }

    document.getElementById('rows').innerHTML = data.map(item => `
      <tr>
        <td>${esc(item.company)}</td>
        <td>${esc(item.type)}</td>
        <td>${esc(item.quantity)}</td>
        <td>${esc(item.dateNeeded)}</td>
        <td>${esc(item.duration)}</td>
        <td class="location">${esc(item.location || item.area || '—')}</td>
        <td class="notes">${esc(item.notes || '—')}</td>
      </tr>
    `).join('');

  } catch (error) {
    document.getElementById('rows').innerHTML =
      '<tr><td colspan="7">Unable to load equipment demand.</td></tr>';
  }
}

loadVendorData();
</script>

</body>
</html>
