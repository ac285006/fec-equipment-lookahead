<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Look-Ahead Dashboard</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top"><img src="/fec-official.svg"></header><main class="wrap"><div id="login" class="card login"><h2>Management Dashboard</h2><p class="note">Authorized project personnel only.</p><div class="field"><label>Password</label><input id="pw" type="password"></div><button class="btn full" id="go">Sign In</button><p id="err" class="bad"></p></div><div id="app" class="hidden"><div class="toolbar"><div class="hero"><div class="muted">PRIVATE MANAGEMENT VIEW</div><h1>Equipment Look-Ahead</h1></div><button class="btn secondary" id="test">Preview Test Email</button></div><div class="stats"><div class="card stat"><span class="muted">Trade Partners</span><strong id="total"></strong></div><div class="card stat"><span class="muted">Complete</span><strong id="complete"></strong></div><div class="card stat"><span class="muted">Outstanding</span><strong id="outstanding"></strong></div><div class="card stat"><span class="muted">Equipment Qty</span><strong id="qty"></strong></div></div><div class="card table"><table><thead><tr><th>Trade Partner</th><th>Status</th><th>Submitted</th><th>Reminders</th><th>Forecast</th></tr></thead><tbody id="rows"></tbody></table></div><div id="preview" class="card hidden"></div></div></main><script>const $=id=>document.getElementById(id);let pw='';async function load(){const r=await fetch('/api/dashboard',{headers:{authorization:'Bearer '+pw}});if(!r.ok){$('err').textContent='Access denied.';return}const d=await r.json();$('login').classList.add('hidden');$('app').classList.remove('hidden');$('total').textContent=d.partners.length;const c=d.partners.filter(x=>x.status==='complete');$('complete').textContent=c.length;$('outstanding').textContent=d.partners.length-c.length;$('qty').textContent=c.flatMap(x=>x.submission?.items||[]).reduce((a,x)=>a+Number(x.quantity||0),0);$('rows').innerHTML=d.partners.map(x=>`<tr><td><strong>${x.company}</strong></td><td class="${x.status==='complete'?'ok':'bad'}">${x.status==='complete'?'✓ Complete':'● Outstanding'}</td><td>${x.submittedAt?new Date(x.submittedAt).toLocaleString():'—'}</td><td>${x.reminders||0}</td><td>${x.submission?.noEquipment?'No equipment':x.submission?.items?.map(i=>`${i.quantity} × ${i.type}`).join('<br>')||'—'}</td></tr>`).join('')};$('go').onclick=()=>{pw=$('pw').value;load()};$('test').onclick=async()=>{const r=await fetch('/api/admin/test-email',{method:'POST',headers:{authorization:'Bearer '+pw}});const j=await r.json();$('preview').classList.remove('hidden');$('preview').innerHTML=`<h3>Trade Partner Email Preview</h3><p><strong>To:</strong> ${j.to}</p><p><strong>Subject:</strong> ${j.subject}</p><p>Your equipment look-ahead is required. Please identify anticipated rental equipment needs for the upcoming six-week period. Even if no additional equipment is required, a response is required.</p><p><a class="btn" href="${j.link}">COMPLETE EQUIPMENT LOOK-AHEAD</a></p><p class="note">${j.note}</p>`};</script></body></html>
