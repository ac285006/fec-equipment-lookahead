<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FEC On-Rent Equipment</title>

  <link rel="stylesheet" href="/styles.css">

  <style>
.brand-header {
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  border-bottom: 4px solid #1683ed;
  overflow: hidden;
}

.brand-header img {
  display: block;
  width: auto;
  height: 52px;
  max-width: 260px;
  object-fit: contain;
}
    .onrent-page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }

    .onrent-eyebrow {
      color: #8fa3bd;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 6px;
    }

    .onrent-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 24px;
    }

    .onrent-header h1 {
      margin: 0;
    }

    .onrent-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .onrent-btn {
      border: 1px solid #34465a;
      background: #16202c;
      color: #fff;
      border-radius: 7px;
      padding: 11px 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .onrent-btn.primary {
      background: #1683ed;
      border-color: #1683ed;
    }

    .onrent-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .onrent-card {
      background: #131d29;
      border: 1px solid #263648;
      border-radius: 12px;
      padding: 18px;
    }

    .onrent-label {
      color: #8fa3bd;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .onrent-value {
      font-size: 28px;
      font-weight: 800;
    }

    .onrent-panel {
      background: #131d29;
      border: 1px solid #263648;
      border-radius: 12px;
      padding: 18px;
    }

    .onrent-toolbar {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .onrent-search {
      flex: 1;
      min-width: 260px;
      background: #0b131d;
      border: 1px solid #34465a;
      color: #fff;
      border-radius: 7px;
      padding: 11px 12px;
    }

    .onrent-table-wrap {
      overflow-x: auto;
    }

    .onrent-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1000px;
    }

    .onrent-table th,
    .onrent-table td {
      padding: 12px 10px;
      border-bottom: 1px solid #263648;
      text-align: left;
      white-space: nowrap;
    }

    .onrent-table th {
      color: #fff;
      font-size: 13px;
    }

    .onrent-empty {
      color: #8fa3bd;
      padding: 28px 10px !important;
      text-align: center !important;
    }

    @media (max-width: 800px) {
      .onrent-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .onrent-stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <header class="brand-header">
    <img src="/fec-official.svg" alt="FEC">
  </header>

  <main class="onrent-page">

    <div class="onrent-header">
      <div>
        <div class="onrent-eyebrow">Project Equipment Management</div>
        <h1>Current On-Rent Equipment</h1>
      </div>

      <div class="onrent-actions"><button
  class="onrent-btn"
  id="importVendorButton"
  type="button"
>
  Import Vendor Report
</button>

<input
  id="vendorReportFile"
  type="file"
  accept=".csv,.xls,.xlsx"
  hidden
>
        <button class="onrent-btn primary">Download FEC Report</button>
      </div>
    </div>

    <section class="onrent-stats">

      <div class="onrent-card">
        <div class="onrent-label">Equipment On Rent</div>
        <div class="onrent-value">—</div>
      </div>

      <div class="onrent-card">
        <div class="onrent-label">Trade Partners</div>
        <div class="onrent-value">—</div>
      </div>

      <div class="onrent-card">
        <div class="onrent-label">Equipment Groups</div>
        <div class="onrent-value">—</div>
      </div>

      <div class="onrent-card">
        <div class="onrent-label">Last Updated</div>
        <div class="onrent-value" style="font-size:18px;">—</div>
      </div>

    </section>

    <section class="onrent-panel">

      <div class="onrent-toolbar">
        <input
          class="onrent-search"
          type="search"
          placeholder="Search trade partner, equipment, PO, site contact, asset #..."
        >
      </div>

      <div class="onrent-table-wrap">
        <table class="onrent-table">
          <thead>
            <tr>
              <th>Trade Partner</th>
              <th>Equipment Description</th>
              <th>Qty</th>
              <th>Equip #</th>
              <th>Serial #</th>
              <th>PO</th>
              <th>Site Contact</th>
              <th>Contract #</th>
              <th>Start</th>
              <th>Return</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td colspan="10" class="onrent-empty">
                No on-rent data has been imported yet.
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </section>

  </main>
<script>
  let onRentEquipment = [];

  const escapeHtml = value =>
    String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');

  const formatDate = value => {
    if (!value) return '—';

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return escapeHtml(value);
    }

    return date.toLocaleDateString();
  };

  function renderEquipment(rows) {
    const tbody = document.querySelector('.onrent-table tbody');

    if (!rows.length) {
      tbody.innerHTML = `
        <tr>
          <td colspan="10" class="onrent-empty">
            No on-rent equipment found.
          </td>
        </tr>
      `;
      return;
    }

    tbody.innerHTML = rows.map(item => `
      <tr>
        <td>${escapeHtml(item.trade_partner || '—')}</td>
        <td>${escapeHtml(item.equipment_description || '—')}</td>
        <td>${escapeHtml(item.quantity ?? 1)}</td>
        <td>${escapeHtml(item.equipment_number || '—')}</td>
        <td>${escapeHtml(item.serial_number || '—')}</td>
        <td>${escapeHtml(item.purchase_order || '—')}</td>
        <td>${escapeHtml(item.site_contact || '—')}</td>
        <td>${escapeHtml(item.contract_number || '—')}</td>
        <td>${formatDate(item.start_date)}</td>
        <td>${formatDate(item.return_date)}</td>
      </tr>
    `).join('');
  }

  function renderStats(stats) {
    const values = document.querySelectorAll('.onrent-value');

    values[0].textContent =
      Number(stats.equipmentQty || 0).toLocaleString();

    values[1].textContent =
      Number(stats.tradePartners || 0).toLocaleString();

    values[2].textContent =
      Number(stats.equipmentGroups || 0).toLocaleString();

    values[3].textContent = stats.lastUpdated
      ? new Date(stats.lastUpdated).toLocaleString()
      : 'Not imported yet';
  }

  async function loadOnRent() {
    try {
      const response = await fetch('/api/onrent');
      const result = await response.json();

      if (!response.ok || !result.ok) {
        throw new Error(
          result.error || 'Unable to load on-rent equipment.'
        );
      }

      onRentEquipment = result.equipment || [];

      renderStats(result.stats || {});
      renderEquipment(onRentEquipment);

    } catch (error) {
      console.error(error);

      document.querySelector('.onrent-table tbody').innerHTML = `
        <tr>
          <td colspan="10" class="onrent-empty">
            Unable to load on-rent equipment.
          </td>
        </tr>
      `;
    }
  }

  document
    .querySelector('.onrent-search')
    .addEventListener('input', event => {
      const search = event.target.value
        .trim()
        .toLowerCase();

      if (!search) {
        renderEquipment(onRentEquipment);
        return;
      }

      const filtered = onRentEquipment.filter(item =>
        [
          item.trade_partner,
          item.equipment_description,
          item.equipment_number,
          item.serial_number,
          item.purchase_order,
          item.site_contact,
          item.contract_number
        ]
          .filter(Boolean)
          .some(value =>
            String(value).toLowerCase().includes(search)
          )
      );

      renderEquipment(filtered);
    });

  const importVendorButton =
  document.getElementById('importVendorButton');

const vendorReportFile =
  document.getElementById('vendorReportFile');

importVendorButton.addEventListener('click', () => {
  vendorReportFile.click();
});

vendorReportFile.addEventListener('change', async () => {
  const file = vendorReportFile.files[0];

  if (!file) return;

  const originalText = importVendorButton.textContent;

  importVendorButton.disabled = true;
  importVendorButton.textContent = 'Reading Report...';

  try {
    const formData = new FormData();
    formData.append('report', file);

    const response = await fetch('/api/onrent/detect', {
      method: 'POST',
      body: formData
    });

    const result = await response.json();

    if (!response.ok || !result.ok) {
      throw new Error(
        result.error || 'Unable to read vendor report.'
      );
    }

    const headerPreview = result.headers
      .slice(0, 50)
      .join(', ');

    alert(
      `Report recognized\n\n` +
      `Vendor: ${result.vendor}\n` +
      `File: ${result.fileName}\n` +
      `Worksheet: ${result.sheetName}\n` +
      `Records detected: ${result.rowCount}\n\n` +
      `First columns:\n${headerPreview}`
    );

  } catch (error) {
    console.error(error);

    alert(
      `Unable to recognize this report.\n\n${error.message}`
    );

  } finally {
    importVendorButton.disabled = false;
    importVendorButton.textContent = originalText;
    vendorReportFile.value = '';
  }
});

loadOnRent();
</script>
  
</body>
</html>
